name: Refresh documentation
on: 
  push:
    branches:
      # Only update docs for dev branch pushes
      - dev
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  docfx:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # prevent parallel executions
    - name: Wait for actions to finish
      uses: softprops/turnstyle@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    
    # Checks-out dev branch
    - name: Checkout dev branch
      uses: actions/checkout@v4
      with: 
        ref: dev
        path: dev
    # Checks-out gh-pages branch
    - name: Checkout gh-pages branch
      uses: actions/checkout@v4
      with: 
        ref: gh-pages
        path: gh-pages
    # Setup .NET (required for DocFx)
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.x
    # Install docfx as a .NET global tool
    - name: Install dependencies
      run: dotnet tool install -g docfx --version 2.78.5
    # Build docs
    - name: Build docs
      shell: pwsh
      run: |
        ./dev/docs/build.ps1
    # Add, commit and push the changes
    - name: Add & Commit & Push
      uses: EndBug/add-and-commit@v10
      with:
        # The directory where your repository is located. You should use actions/checkout first to set it up
        cwd: ./gh-pages
        branch: gh-pages
        push: true
        token: ${{ secrets.GITHUB_TOKEN }}
